{% extends 'base_web.html' %}

{% block content %}
<div class="card" style="max-width: 620px; margin: 0 auto;">
    <h2 style="margin-bottom: 20px;">Edit Product</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Product Name</label>
            <input type="text" name="name" value="{{ product.name }}" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Brand</label>
            <input type="text" name="brand" value="{{ product.brand }}" required>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Category</label>
            <select name="category">
                <option value="medicine" {% if product.category == 'medicine' %}selected{% endif %}>Medicine</option>
                <option value="device" {% if product.category == 'device' %}selected{% endif %}>Device</option>
                <option value="supplement" {% if product.category == 'supplement' %}selected{% endif %}>Supplement</option>
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Condition</label>
            <select name="condition">
                <option value="diabetes" {% if product.condition == 'diabetes' %}selected{% endif %}>Diabetes</option>
                <option value="bp" {% if product.condition == 'bp' %}selected{% endif %}>Blood Pressure</option>
                <option value="heart" {% if product.condition == 'heart' %}selected{% endif %}>Heart</option>
                <option value="general" {% if product.condition == 'general' %}selected{% endif %}>General</option>
            </select>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">Price</label>
                <input type="number" step="0.01" name="price" value="{{ product.price }}" required>
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">Stock Quantity</label>
                <input type="number" name="stock" value="{{ product.stock }}" required>
            </div>
        </div>

        <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px; background: #fff8e1; padding: 10px; border-radius: 8px; border: 1px solid #ffe082;">
            <input type="checkbox" name="prescription_required" id="rx_check_edit" style="width: 20px; height: 20px; cursor: pointer;" {% if product.prescription_required %}checked{% endif %}>
            <label for="rx_check_edit" style="font-weight: 600; cursor: pointer;">📄 Prescription Required for this product</label>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">⚠️ Restricted / Not Suitable For</label>
            <input type="text" name="allergic_to" value="{{ product.allergic_to|default:'' }}"
                placeholder="e.g. Pregnant, Diabetic, Heart Patient (comma separated)" style="width:100%;">
            <small style="color:#64748b; font-size:12px; display:block; margin-top:4px;">
                Patients with these conditions will see a warning on the shop page.
            </small>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">🖼️ Product Image</label>
            {% if product.image %}
            <div style="margin-bottom:10px; display:flex; align-items:center; gap:12px;">
                <img src="{{ product.image.url }}" alt="{{ product.name }}"
                    style="width:70px; height:70px; object-fit:cover; border-radius:10px; border:1px solid #e2e8f0;">
                <small style="color:#64748b;">Current image. Upload a new one to replace it.</small>
            </div>
            {% endif %}
            <input type="file" name="image" accept="image/*">
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{% url 'stock_report' %}" class="btn" style="background:#f1f5f9; color:#333; margin-left:10px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
