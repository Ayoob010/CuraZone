{% extends 'base_mobile.html' %}

{% block content %}
<style>
  /* RESET & VARS */
  :root {
    --primary-grad: linear-gradient(135deg, #3b82f6, #2563eb);
    --bg-chat: #ffffff;
    --white: #ffffff;
    --gray-text: #64748b;
    --user-bubble: #3b82f6;
    --bot-bubble: #f1f5f9;
    --chatbot-height: calc(95vh - 180px);
    /* Adjust for header + footer */
  }

  /* CONTAINER INSTEAD OF FULL PAGE */
  .chatbot-card {
    background: var(--white);
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    display: flex;
    flex-direction: column;
    height: var(--chatbot-height);
    overflow: hidden;
    margin-top: 10px;
    position: relative;
  }

  /* HEADER */
  .chat-header {
    background: var(--white);
    padding: 15px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    border-bottom: 1px solid #f1f5f9;
    flex-shrink: 0;
  }

  .back-btn {
    display: none;
    /* Hide back button since we have nav */
  }

  .bot-info {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bot-avatar {
    width: 40px;
    height: 40px;
    background: var(--primary-grad);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
  }

  .bot-text h3 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: #1e293b;
  }

  .bot-text span {
    font-size: 12px;
    color: #10b981;
    font-weight: 500;
  }

  /* CHAT BODY */
  .chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    scroll-behavior: smooth;
    background: #f8fafc;
  }

  /* MESSAGES */
  .chat-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    opacity: 0;
    animation: slideUp 0.3s forwards;
  }

  .chat-row.user {
    justify-content: flex-end;
  }

  .chat-row.bot {
    justify-content: flex-start;
  }

  .bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    position: relative;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }

  .chat-row.bot .bubble {
    background: var(--bot-bubble);
    color: #334155;
    border-bottom-left-radius: 4px;
  }

  .chat-row.user .bubble {
    background: var(--primary-grad);
    color: var(--white);
    border-bottom-right-radius: 4px;
  }

  .chat-time {
    font-size: 9px;
    opacity: 0.7;
    margin-top: 4px;
    text-align: right;
  }

  /* SUGGESTIONS */
  .suggestions-container {
    padding: 10px 15px;
    overflow-x: auto;
    white-space: nowrap;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
    background: #fff;
    border-top: 1px solid #f1f5f9;
    scrollbar-width: none;
    /* Hide scrollbar */
  }

  .suggestions-container::-webkit-scrollbar {
    display: none;
  }

  .chip {
    background: #f1f5f9;
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    color: #475569;
    cursor: pointer;
    transition: 0.2s;
  }

  .chip:hover {
    background: #e2e8f0;
    color: #1e293b;
  }

  /* INPUT AREA */
  .chat-input-area {
    background: white;
    padding: 10px 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-top: 1px solid #f1f5f9;
  }

  .input-field {
    flex: 1;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    padding: 10px 16px;
    border-radius: 24px;
    font-size: 14px;
    outline: none;
  }

  .input-field:focus {
    border-color: #3b82f6;
    background: white;
  }

  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--primary-grad);
    border: none;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
  }

  .send-btn svg {

    margin-left: 9px;
    margin-bottom: 17px;
  }

  .send-btn:active {
    transform: scale(0.95);
  }

  /* ANIMATION */
  @keyframes slideUp {
    from {
      transform: translateY(10px);
      opacity: 0;
    }

    to {
      transform: translateY(0);
      opacity: 1;
    }
  }
</style>

<div class="div-for-spacing" style="padding: 0 10px;">
  <!-- Chat Card -->
  <div class="chatbot-card">
    <!-- Header -->
    <div class="chat-header">
      <div class="bot-info">
        <div class="bot-avatar">🤖</div>
        <div class="bot-text">
          <h3>MediBot</h3>
          <span>AI Assistant</span>
        </div>
      </div>
    </div>

    <!-- Chat Body -->
    <div class="chat-body" id="chatBody">
      <div class="chat-row bot">
        <div class="bubble">
          Hello! I'm MediBot. Ask me about any medicine or health condition. I'm not 100% accurate.
          <div class="chat-time">Just now</div>
        </div>
      </div>
    </div>

    <!-- Quick Suggestions -->
    <div class="suggestions-container" id="quickSuggestions">
      <button class="chip">🤕 Headache relief</button>
      <button class="chip">💊 Paracetamol dosage</button>
      <button class="chip">🤒 Fever symptoms</button>
      <button class="chip">🤧 Cold remedies</button>
      <button class="chip">🧼 Side effects of Ibuprofen</button>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <input type="text" id="userInput" class="input-field" placeholder="Type your symptoms..." autocomplete="off">
      <button id="sendBtn" class="send-btn">
        <svg viewBox="0 0 24 24" width="20" height="20" transform="rotate(-45 12 12)">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" fill="none"
            stroke-linecap="round" stroke-linejoin="round" class="ico" />
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  (function () {
    const chatBody = document.getElementById('chatBody');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const quickSug = document.getElementById('quickSuggestions');

    function scrollBottom() {
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function appendMessage({ who = 'user', text = '' }) {
      const row = document.createElement('div');
      row.className = 'chat-row ' + (who === 'bot' ? 'bot' : 'user');

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerText = text;

      // Add time
      const time = document.createElement('div');
      time.className = 'chat-time';
      const now = new Date();
      time.innerText = now.getHours() + ':' + (now.getMinutes() < 10 ? '0' : '') + now.getMinutes();
      bubble.appendChild(time);

      row.appendChild(bubble);
      chatBody.appendChild(row);
      scrollBottom();
    }

    async function botReplyFor(text) {
      try {
        const response = await fetch('/api/chat/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ message: text })
        });
        const data = await response.json();
        return data;
      } catch (error) {
        console.error('Error:', error);
        return { response: "Sorry, I'm having trouble connecting to the server.", added_info: null };
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage({ who: 'user', text });
      userInput.value = '';

      // Get bot response
      const data = await botReplyFor(text);
      appendMessage({ who: 'bot', text: data.response });

      // Handle auto-added items
      if (data.added_info) {
        const infoRow = document.createElement('div');
        infoRow.className = 'chat-row bot';
        
        const infoBubble = document.createElement('div');
        infoBubble.className = 'bubble';
        infoBubble.style.background = '#dcfce7'; // Light green
        infoBubble.style.border = '1px solid #22c55e';
        infoBubble.style.color = '#166534';
        infoBubble.style.fontWeight = '600';
        infoBubble.innerHTML = '✨ ' + data.added_info;
        
        infoRow.appendChild(infoBubble);
        chatBody.appendChild(infoRow);
        scrollBottom();
      }
    }

    quickSug.addEventListener('click', function (e) {
      if (e.target.tagName === 'BUTTON') {
        const text = e.target.innerText;
        // Simple removal: matches leading non-word characters (emojis, etc)
        const cleanText = text.replace(/^[^\w\s]+/, '').trim();

        userInput.value = cleanText;
        sendMessage();
      }
    });

    scrollBottom();

  })();
</script>
{% endblock %}
