{% extends 'base_mobile.html' %}

{% block content %}
<div class="section">
  <div class="card">
    <h2 style="margin-top:0;">Payment</h2>
    <div style="margin-bottom:20px;">
      <div style="font-size:14px; color:#64748b;">Total Amount</div>
      <div style="font-size:32px; font-weight:700; color:#1e293b;">₹{{ total }}</div>
    </div>

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom:20px;">
        <label style="display:block; margin-bottom:10px; font-weight:600;">Select Payment Method</label>

        <label
          style="display:flex; align-items:center; gap:10px; padding:12px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:10px;">
          <input type="radio" name="method" value="card" checked>
          <span>Credit / Debit Card</span>
        </label>

        <label
          style="display:flex; align-items:center; gap:10px; padding:12px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:10px;">
          <input type="radio" name="method" value="upi">
          <span>UPI / Wallet</span>
        </label>

        <label
          style="display:flex; align-items:center; gap:10px; padding:12px; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:10px;">
          <input type="radio" name="method" value="cod">
          <span>Cash on Delivery</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-size:16px;">Pay ₹
        {{ total }}</button>
    </form>
  </div>
</div>
{% endblock %}
