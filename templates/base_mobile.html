<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Health App</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f2f6fb;
        }

        .app-container {
            max-width: 420px;
            margin: auto;
            min-height: 100vh;
            background: #f2f6fb;
            padding-bottom: 80px;
            /* Space for bottom nav */
        }

        /* Common utility classes for mobile */
        .section {
            padding: 0 20px;
            margin-top: 20px;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn-primary {
            background: #3b82f6;
            color: #fff;
        }

        /* Messages */
        .messages {
            padding: 10px 20px;
        }

        .message {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>

    <div class="app-container">
        {% include 'header.html' %}

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        {% block content %}
        {% endblock %}

        {% include 'footer.html' %}
    </div>

</body>

</html>
