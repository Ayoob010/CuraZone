{% extends "base_mobile.html" %}
{% block content %}
<div class="section">
    <div class="card" style="margin-top: 10px;">
        <h2 style="color: #1a237e; font-size: 1.3rem; margin-top: 0;">New Monthly Refill 🗓️</h2>
        <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Medicines will be auto-added to your cart every 30 days.</p>

        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 18px;">
                <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: #334155;">Medicine</label>
                <select name="product_id" required style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; background: #f8fafc;">
                    <option value="">-- Select --</option>
                    {% for product in products %}
                        <option value="{{ product.id }}">{{ product.name }} (₹{{ product.price }})</option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: #334155;">Monthly Quantity</label>
                <input type="number" name="quantity" min="1" value="1" required 
                       style="width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 15px; outline: none; background: #f8fafc;">
            </div>

            <div style="display: flex; gap: 12px;">
                <button type="submit" class="btn btn-primary" style="flex: 1; padding: 14px; font-weight: 600; border-radius: 12px; background: #2563eb;">Activate Refill</button>
                <a href="{% url 'patient_refills' %}" 
                   style="flex: 1; text-align: center; padding: 14px; background: #f1f5f9; color: #475569; text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 14px;">
                   Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
