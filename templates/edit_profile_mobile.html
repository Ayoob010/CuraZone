{% extends 'base_mobile.html' %}

{% block content %}
<div class="section">
    <div class="card" style="padding: 20px;">
        <h2 style="margin-top:0; margin-bottom:20px; text-align:center;">Edit Profile</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Profile Image -->
            <div style="text-align:center; margin-bottom:20px;">
                {% if request.user.profile %}
                <img src="{{ request.user.profile.url }}"
                    style="width:80px; height:80px; border-radius:50%; object-fit:cover; margin-bottom:10px;">
                {% else %}
                <div
                    style="width:80px; height:80px; background:#e2e8f0; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:24px;">
                    📷
                </div>
                {% endif %}
                <input type="file" name="dimage" style="display:block; margin:0 auto; font-size:12px;">
            </div>

            <!-- Basic Info -->
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px;">Full Name</label>
                <input type="text" name="dname" value="{{ request.user.fullname }}" required
                    style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px;">Phone</label>
                <input type="text" name="dphone" value="{{ request.user.phone }}"
                    style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px;">Age</label>
                <input type="number" name="age" value="{{ request.user.age|default:'' }}"
                    style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;">
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px;">Height
                        (cm)</label>
                    <input type="number" name="height" value="{{ request.user.height_cm|default:'' }}"
                        style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px;">Weight
                        (kg)</label>
                    <input type="number" step="0.1" name="weight" value="{{ request.user.weight_kg|default:'' }}"
                        style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;">
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px;">Blood Type</label>
                <select name="blood_type"
                    style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; background:#fff;">
                    <option value="">Select Blood Type</option>
                    {% for code, name in blood_types %}
                    <option value="{{ code }}" {% if request.user.blood_type == code %}selected{% endif %}>{{ name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px;">Gender</label>
                <select name="gender"
                    style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; background:#fff;">
                    <option value="">Select Gender</option>
                    {% for code, name in gender_choices %}
                    <option value="{{ code }}" {% if request.user.gender == code %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom:5px; font-weight:600; font-size:14px;">🏥 Health Conditions / Allergies</label>
                <input type="text" name="health_conditions" value="{{ request.user.health_conditions|default:'' }}"
                    placeholder="e.g. Pregnant, Diabetes, Penicillin allergy"
                    style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px;">
                <small style="color:#64748b; font-size:12px; display:block; margin-top:4px;">
                    Comma-separated list. Helps show medicine warnings.
                </small>
            </div>

            <button type="submit"
                style="width:100%; padding:12px; background:#3b82f6; color:#fff; border:none; border-radius:8px; font-weight:600; margin-bottom:10px;">Save
                Changes</button>
            <a href="{% url 'profile' %}"
                style="display:block; text-align:center; padding:12px; background:#f1f5f9; color:#333; text-decoration:none; border-radius:8px; font-weight:600;">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
