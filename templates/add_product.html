{% extends 'base_web.html' %}

{% block content %}
<div class="card" style="max-width: 620px; margin: 0 auto;">
    <h2 style="margin-bottom: 20px;">Add New Product</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Product Name</label>
            <input type="text" name="name" required placeholder="Enter product name">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Brand</label>
            <input type="text" name="brand" value="Generic" required placeholder="Enter brand name">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Category</label>
            <select name="category">
                <option value="medicine">Medicine</option>
                <option value="device">Device</option>
                <option value="supplement">Supplement</option>
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">Condition</label>
            <select name="condition">
                <option value="diabetes">Diabetes</option>
                <option value="bp">Blood Pressure</option>
                <option value="heart">Heart</option>
                <option value="general" selected>General</option>
            </select>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">Price</label>
                <input type="number" step="0.01" name="price" required placeholder="0.00">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">Stock Quantity</label>
                <input type="number" name="stock" required placeholder="0">
            </div>
        </div>

        <div style="margin-bottom: 20px; display: flex; align-items: center; gap: 10px; background: #fff8e1; padding: 10px; border-radius: 8px; border: 1px solid #ffe082;">
            <input type="checkbox" name="prescription_required" id="rx_check" style="width: 20px; height: 20px; cursor: pointer;">
            <label for="rx_check" style="font-weight: 600; cursor: pointer;">📄 Prescription Required for this product</label>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">⚠️ Restricted / Not Suitable For</label>
            <input type="text" name="allergic_to" placeholder="e.g. Pregnant, Diabetic, Heart Patient (comma separated)" style="width:100%;">
            <small style="color:#64748b; font-size:12px; display:block; margin-top:4px;">
                Patients with these conditions will see a warning on the shop page.
            </small>
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px; font-weight:600;">🖼️ Product Image</label>
            <input type="file" name="image" accept="image/*">
            <small style="color:#64748b; font-size:12px; display:block; margin-top:4px;">Optional — shown to patients on the shop page.</small>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Add Product</button>
            <a href="{% url 'stock_report' %}" class="btn" style="background:#f1f5f9; color:#333; margin-left:10px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
