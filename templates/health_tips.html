{% extends 'base_mobile.html' %}

{% block content %}
<div class="section">
  <h2 style="margin-top:0;">Health Tips</h2>

  

  <div class="card" style="margin-top:20px;">
    <h3 style="margin-top:0;">Daily Habits</h3>
    <div style="display:flex; align-items:center; gap:15px; margin-bottom:15px;">
      <div style="font-size:24px;">💧</div>
      <div>
        <strong>Hydration</strong>
        <div style="font-size:13px; color:#64748b;">Drink 8 glasses of water</div>
      </div>
      <input type="checkbox" style="margin-left:auto; width:20px; height:20px;">
    </div>
    <div style="display:flex; align-items:center; gap:15px;">
      <div style="font-size:24px;">🚶</div>
      <div>
        <strong>30 Mins Walk</strong>
        <div style="font-size:13px; color:#64748b;">Keep moving</div>
      </div>
      <input type="checkbox" style="margin-left:auto; width:20px; height:20px;">
    </div>
  </div>
</div>
{% endblock %}
